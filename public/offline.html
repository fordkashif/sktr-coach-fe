<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>You are offline | SKTR Coach</title>
    <style>
      html, body { height: 100%; margin: 0; background: #ffffff; color: #0e1320; }
      body { display: flex; align-items: center; justify-content: center; font-family: "Outfit Variable", Outfit, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 420px; padding: 24px 20px; }
      .brand { margin: 0 0 28px; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; color: #2152ff; }
      h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.04em; }
      p.lede { margin: 0 0 24px; font-size: 16px; line-height: 1.45; color: #5a6274; }
      button { height: 44px; padding: 0 18px; border: 0; border-radius: 14px; background: #2152ff; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 2px solid #2152ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">SKTR Coach</p>
      <h1>You are offline.</h1>
      <p class="lede">Session logging still saves on this device and syncs when you are back online.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
