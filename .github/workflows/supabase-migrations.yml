name: Supabase Migrations

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  migrate-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase --version
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Migrations (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked

      - name: Sync Edge Function Secrets (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          # Where the app is hosted for this environment, for example https://app.example.com.
          # Not a secret: set it as an environment variable (or as a secret, either works).
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || secrets.PUBLIC_APP_URL }}
          # Push notifications (made with scripts/generate-vapid-keys.mjs). Optional: push stays off without them.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY || 'BEvdbHtgctRC2_Vyptf9mjDWWTjhhC0G09CJONkXhsePt8KjBa5eUWP7IaL5rNYAipWbHaIYdGRaTecgsdfKD6c' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT || 'mailto:support@thesktr.com' }}
        run: |
          supabase secrets set \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            RESEND_API_KEY="$RESEND_API_KEY" \
            NOTIFICATION_FROM_EMAIL="$NOTIFICATION_FROM_EMAIL" \
            --project-ref "$SUPABASE_PROJECT_REF"
          # Invite emails build their links from PUBLIC_APP_URL. Only sync it when it is configured here,
          # so a value set by hand in the Supabase dashboard is never overwritten with nothing.
          if [ -n "$PUBLIC_APP_URL" ]; then
            supabase secrets set PUBLIC_APP_URL="$PUBLIC_APP_URL" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "::warning::PUBLIC_APP_URL is not set for this environment. Invite emails will not send until it is set here or in the Supabase edge function secrets."
          fi
          # Push keys: all three or nothing, so values set by hand in the Supabase dashboard are never overwritten with nothing.
          if [ -n "$VAPID_PUBLIC_KEY" ] && [ -n "$VAPID_PRIVATE_KEY" ] && [ -n "$VAPID_SUBJECT" ]; then
            supabase secrets set \
              VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
              VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
              VAPID_SUBJECT="$VAPID_SUBJECT" \
              --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "::notice::VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT are not all set for this environment. Push notifications stay off; everything else works."
          fi

      - name: Deploy Edge Functions (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy platform-admin-send-club-admin-invite --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy dispatch-notification-emails --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy platform-admin-preview-club-admin-invite --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy local-preview-password-reset --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy claim-coach-invite-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy claim-athlete-invite-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy claim-guardian-invite-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-invite-email --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy purge-deleted-storage --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy calendar-feed --project-ref "$SUPABASE_PROJECT_REF"

      # Lets the function tell the database where it lives (so the database scheduler can call it) and
      # sends anything already waiting. Not required: the address is also learned the first time a
      # signed-in person queues an email. A failure here never fails the deploy.
      - name: Start Notification Email Delivery (dev)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not set, skipping. Email delivery still starts on its own."
            exit 0
          fi
          curl --silent --show-error --max-time 60 -X POST "${SUPABASE_URL%/}/functions/v1/dispatch-notification-emails" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"source":"deploy"}' || echo "::warning::Could not reach dispatch-notification-emails. Email delivery still starts on its own."

  migrate-prod:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase --version
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Migrations (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked

      - name: Sync Edge Function Secrets (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          # Where the app is hosted for this environment, for example https://app.example.com.
          # Not a secret: set it as an environment variable (or as a secret, either works).
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || secrets.PUBLIC_APP_URL }}
          # Push notifications (made with scripts/generate-vapid-keys.mjs). Optional: push stays off without them.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY || 'BEvdbHtgctRC2_Vyptf9mjDWWTjhhC0G09CJONkXhsePt8KjBa5eUWP7IaL5rNYAipWbHaIYdGRaTecgsdfKD6c' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT || 'mailto:support@thesktr.com' }}
        run: |
          supabase secrets set \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            RESEND_API_KEY="$RESEND_API_KEY" \
            NOTIFICATION_FROM_EMAIL="$NOTIFICATION_FROM_EMAIL" \
            --project-ref "$SUPABASE_PROJECT_REF"
          # Invite emails build their links from PUBLIC_APP_URL. Only sync it when it is configured here,
          # so a value set by hand in the Supabase dashboard is never overwritten with nothing.
          if [ -n "$PUBLIC_APP_URL" ]; then
